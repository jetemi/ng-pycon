{% extends base_template %}
{% load static %}

{% block title %}Password reset complete{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-lg shadow-md p-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Password reset</h1>
            <p class="text-sm text-gray-600 mb-6">
                Your password has been set. You can now sign in with your new password.
            </p>
            <a href="{% url 'login' %}" class="theme-button inline-block py-3 px-6">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
